<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRONG Sales Report Generator</title>
<style>
  body { margin: 0; background: #000; color: #87CEEB; font-family: Montserrat, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .box { max-width: 520px; padding: 24px; }
  .msg { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  .err { color: #fff; font-size: 13px; line-height: 1.6; margin-top: 16px; display: none; }
  .err a { color: #87CEEB; }
</style>
</head>
<body>
<div class="box">
  <div class="msg" id="msg">Loading the latest generator…</div>
  <div class="err" id="err"></div>
</div>
<script>
/*
  Stable entry point for the generator. Do not edit this file when publishing a new version.
  To publish: upload the new file as STRONG_Generator_Mk<N>_v<N>.html (e.g. STRONG_Generator_Mk2_v5.html).
  This page lists the repo's files, picks the highest Mk/v number, and loads it here,
  so the address bar keeps this URL for bookmarks and sharing.
*/
(function () {
  var REPO = 'salesvp/strong-sales-report-generator-a7k2fx';
  var PATTERN = /^STRONG_Generator_Mk(\d+)_v(\d+)\.html$/;

  function fail(note, files) {
    document.getElementById('msg').textContent = 'Could not load the latest generator automatically';
    var el = document.getElementById('err');
    var html = note;
    if (files && files.length) {
      html += '<br><br>Available versions:<br>' + files.map(function (f) {
        return '<a href="' + f.name + '">' + f.name + '</a>';
      }).join('<br>');
    }
    el.innerHTML = html;
    el.style.display = 'block';
  }

  function render(name) {
    return fetch(name + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      });
  }

  fetch('https://api.github.com/repos/' + REPO + '/contents/', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('GitHub API HTTP ' + r.status); return r.json(); })
    .then(function (items) {
      var files = items
        .filter(function (i) { return i.type === 'file' && PATTERN.test(i.name); })
        .map(function (i) { var m = i.name.match(PATTERN); return { name: i.name, mk: +m[1], v: +m[2] }; })
        .sort(function (a, b) { return (b.mk - a.mk) || (b.v - a.v); });
      if (!files.length) return fail('No generator files found in the repo.');
      return render(files[0].name).catch(function (e) {
        // Fall back to opening the file directly
        window.location.replace(files[0].name);
      });
    })
    .catch(function (e) {
      fail('The file list could not be fetched (' + e.message + '). Open a version directly:', [
        { name: 'STRONG_Generator_Mk2_v4.html' }
      ]);
    });
})();
</script>
</body>
</html>
